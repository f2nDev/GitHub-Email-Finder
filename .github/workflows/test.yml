name: Python Test CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHubリポジトリからコードをチェックアウト
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Python環境の設定
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # pipのキャッシュを有効にして2回目以降を高速化

    # 3. 依存ライブラリのインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pytest

    # 4. pytestの実行
    - name: Run tests with pytest
      run: |
        pytest
